[package]
name = "nearlink-openmls-compat-spike"
version = "0.1.0"
edition = "2021"
rust-version = "1.91"
publish = false
license = "MIT"

[workspace]

[dependencies]
openmls = { git = "https://github.com/openmls/openmls", tag = "openmls-v0.9.0", features = ["js"] }
openmls_rust_crypto = { git = "https://github.com/openmls/openmls", tag = "openmls-v0.9.0" }
openmls_basic_credential = { git = "https://github.com/openmls/openmls", tag = "openmls-v0.9.0" }
tls_codec = { version = "=0.5.0", features = ["derive", "serde", "mls"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# Enable the JavaScript entropy backend required by openmls_rust_crypto's rand_core 0.6 stack.
getrandom_legacy = { package = "getrandom", version = "=0.2.17", features = ["js"] }
