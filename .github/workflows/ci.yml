name: NearLink foundation checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24.18.0
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: npm ci
      - run: rustup toolchain install 1.84.1 --profile minimal
      - run: rustup component add rustfmt --toolchain 1.84.1
      - run: rustup component add clippy --toolchain 1.84.1
      - run: rustup target add wasm32-unknown-unknown --toolchain 1.84.1
      - run: cargo +1.84.1 install wasm-bindgen-cli --version 0.2.103 --locked
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: python -m pip install -r services/local-hub/requirements-dev.lock
      - run: npm run verify:all
      - run: npm run test:e2e
      - run: npm run test:e2e:compat
      - run: cargo +1.84.1 fmt --manifest-path crates/protocol-core/Cargo.toml -- --check
      - run: cargo +1.84.1 test --manifest-path crates/protocol-core/Cargo.toml --locked
      - run: cargo +1.84.1 check --target wasm32-unknown-unknown --manifest-path crates/protocol-core/Cargo.toml --locked
      - run: cargo +1.84.1 clippy --manifest-path crates/protocol-core/Cargo.toml --locked -- -D warnings
      - run: cargo +1.84.1 fmt --manifest-path crates/protocol-wasm/Cargo.toml -- --check
      - run: cargo +1.84.1 test --manifest-path crates/protocol-wasm/Cargo.toml --locked
      - run: cargo +1.84.1 clippy --manifest-path crates/protocol-wasm/Cargo.toml --locked -- -D warnings
      - run: npm run test:wasm
      - name: Build release archives for the packaged smoke
        run: node scripts/build-release-candidate.mjs
        env:
          NEARLINK_RELEASE_VERSION: 0.1.0
          NEARLINK_ARTIFACT_DIR: ${{ runner.temp }}/nearlink-package-smoke-artifact
      - name: Verify and extract the web archive
        run: npm run test:package-archive
      - name: Smoke test the extracted release web archive
        run: npm run test:packaged-smoke -- "$RUNNER_TEMP/nearlink-package-smoke-artifact"

  security-audit:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: npm ci
      - run: npm audit
      - uses: pypa/gh-action-pip-audit@1220774d901786e6f652ae159f7b6bc8fea6d266
        with:
          inputs: services/local-hub/requirements-dev.lock
          no-deps: true
      - run: rustup toolchain install stable --profile minimal
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998
        env:
          RUSTUP_TOOLCHAIN: stable
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: crates/protocol-core
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998
        env:
          RUSTUP_TOOLCHAIN: stable
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: crates/protocol-wasm
      - name: Install research-only RustSec exception config
        run: |
          mkdir -p ~/.cargo
          cp research/openmls-compat-spike/audit.toml ~/.cargo/audit.toml
          echo "Research lock exceptions: RUSTSEC-2026-0330, RUSTSEC-2026-0331"
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998
        env:
          RUSTUP_TOOLCHAIN: stable
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: research/openmls-compat-spike
      - name: Install mls-rs research RustSec config
        run: |
          mkdir -p ~/.cargo
          cp research/mls-rs-compat-spike/audit.toml ~/.cargo/audit.toml
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998
        env:
          RUSTUP_TOOLCHAIN: stable
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: research/mls-rs-compat-spike
