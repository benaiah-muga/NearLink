name: OpenMLS research spike

on:
  push:
    branches: [main]
    paths:
      - research/openmls-compat-spike/**
      - .github/workflows/openmls-research.yml
  pull_request:
    paths:
      - research/openmls-compat-spike/**
      - .github/workflows/openmls-research.yml

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install 1.91.0 --profile minimal
      - run: rustup component add rustfmt --toolchain 1.91.0
      - run: rustup target add wasm32-unknown-unknown --toolchain 1.91.0
      - run: cargo +1.91.0 fmt --manifest-path research/openmls-compat-spike/Cargo.toml -- --check
      - run: cargo +1.91.0 test --manifest-path research/openmls-compat-spike/Cargo.toml --locked
      - run: cargo +1.91.0 check --manifest-path research/openmls-compat-spike/Cargo.toml --locked --tests --target wasm32-unknown-unknown
